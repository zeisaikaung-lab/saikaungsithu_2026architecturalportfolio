<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Kaung Si Thu — Architecture &amp; Computational Design</title>
<meta name="description" content="Portfolio of Sai Kaung Si Thu, graduate architect based in Bangkok working at the intersection of physical craft and computational process.">
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   Weight system — three registers, never mixed:
     display  200  (h1, lead sentences)
     body     400  (running prose, descriptions)
     data     500  (labels, values, titles, nav, credits)
   ============================================================ */
:root{
  /* Type scale — five steps, each clearly distinct. The page previously had
     14 / 15 / 15.5 / 16px all in play, four sizes within 2px doing different
     jobs, plus 9px and 10px mono labels that read as the same size. */
  --t-title:44px;   /* project title            */
  --t-lead:24px;    /* lead sentence            */
  --t-body:15.5px;  /* running text             */
  --t-data:13.5px;  /* metadata values, credits */
  --t-label:10px;   /* all mono labels          */
  /* Vertical rhythm, all multiples of 8 */
  --s-1:8px; --s-2:16px; --s-3:24px; --s-4:40px; --s-5:56px; --s-6:72px;
  --cw:150px;
  --paper:#ffffff;
  --ink:#0f0f0f;
  --ink-mid:#5e5e5e;
  --ink-soft:#8c8c8c;
  --rule:#e0e0e0;
  --rule-strong:#c9c9c9;
  --fill:#f0f0f0;
  --ph-a:#f5f5f5;
  --ph-b:#eaeaea;
  --nav-h:58px;
  --rail:196px;
  --gut:26px;
  --max:1620px;
  --t:.3s cubic-bezier(.2,.6,.2,1);
}
html[data-theme="dark"]{
  --paper:#0c0c0c;
  --ink:#f4f4f4;
  --ink-mid:#9b9b9b;
  --ink-soft:#6d6d6d;
  --rule:#232323;
  --rule-strong:#333333;
  --fill:#171717;
  --ph-a:#161616;
  --ph-b:#1c1c1c;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Poppins',Helvetica,Arial,sans-serif;
  font-weight:400;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background-color var(--t),color var(--t);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
svg{stroke:currentColor}

/* ---------- shared type ---------- */
.display{font-weight:200;letter-spacing:-.03em;line-height:1.06}
.lead{font-weight:200;font-size:clamp(19px,2vw,var(--t-lead));line-height:1.48;letter-spacing:-.012em;max-width:46ch}
.meta-label{
  font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
  font-weight:500;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:400}

/* ---------- header ---------- */
header{
  position:fixed;inset:0 0 auto 0;z-index:70;background:var(--paper);
  border-bottom:1px solid var(--rule);transition:background-color var(--t),border-color var(--t);
}
.bar{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--gut)}
.mark{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.mark span{color:var(--ink-soft);font-weight:400}
.rightset{display:flex;align-items:center;gap:26px}
nav.primary{display:flex;gap:24px;align-items:center}
nav.primary a{
  font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:400;color:var(--ink-mid);
  padding:3px 0;border-bottom:1px solid transparent;transition:color var(--t),border-color var(--t);
}
nav.primary a:hover{color:var(--ink)}
nav.primary a.on{color:var(--ink);font-weight:500;border-color:var(--ink)}

/* theme toggle — sits beside the menu */
.theme{
  display:flex;align-items:center;gap:0;border:1px solid var(--rule-strong);border-radius:999px;
  padding:2px;transition:border-color var(--t);
}
.theme button{
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:9.5px;letter-spacing:.12em;
  padding:5px 10px;border-radius:999px;color:var(--ink-soft);line-height:1;transition:all var(--t);
}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.burger{display:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* ---------- category chips (informal, in-page) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.filter{
  display:inline-flex;align-items:baseline;gap:7px;
  padding:7px 14px;border:1px solid var(--rule-strong);border-radius:999px;
  font-size:12.5px;font-weight:400;color:var(--ink-mid);
  transition:color var(--t),border-color var(--t),background-color var(--t);
}
.filter .n{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;color:var(--ink-soft)}
.filter:hover{color:var(--ink);border-color:var(--ink)}
.filter.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.filter.on .n{color:var(--paper);opacity:.65}

/* ---------- index header band ----------
   Title and philosophy run horizontally across the top; the canvas takes
   everything below. The two anchors of the sentence are set bold and the
   hinge between them light, so it reads as two poles joined. */
/* full-bleed: the projects view uses the whole window, like the header bar */
.index-head{padding:12px var(--gut) 20px}
.hero{
  margin:0;font-size:clamp(25px,3.3vw,53px);line-height:1.08;max-width:none;
  text-wrap:balance;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em;
}
.hero span{
  display:inline-block;opacity:0;
  transform:translateY(.62em) scale(.965);
  animation:heroUp .95s cubic-bezier(.19,.78,.2,1) forwards;
  animation-delay:calc(var(--k,0) * .12s + .1s);
}
@keyframes heroUp{to{opacity:1;transform:none}}
.hero .hb{font-weight:600;letter-spacing:-.036em}
.hero .hl{font-weight:200;letter-spacing:-.014em;color:var(--ink-mid)}
.head-row,.index-head .chips{opacity:0;animation:heroUp .8s cubic-bezier(.19,.78,.2,1) forwards}
.head-row{animation-delay:.46s}
.index-head .chips{animation-delay:.58s}
@media(prefers-reduced-motion:reduce){
  .hero span,.head-row,.index-head .chips{opacity:1;transform:none;animation:none}
}
.head-row{
  display:flex;justify-content:space-between;align-items:flex-end;gap:44px;
  margin-top:24px;padding-bottom:18px;border-bottom:1px solid var(--rule);
}
.head-row .sub{
  /* two columns, the way the project briefs are set in the portfolio itself */
  margin:0;flex:1 1 auto;max-width:960px;
  columns:2;column-gap:36px;column-rule:1px solid var(--rule);
  color:var(--ink-mid);font-size:14px;font-weight:400;line-height:1.64;
  text-align:justify;hyphens:auto;
}
.head-row .sub strong{font-weight:500;color:var(--ink)}
.head-meta{
  display:flex;flex-direction:column;gap:7px;text-align:right;
  flex:0 0 auto;white-space:nowrap;
}
.index-head .chips{margin-top:18px}

/* ---------- opening sequence ----------
   The mark is the Payan vault: a base, two halves of a pointed arch, and its
   ribs. It draws itself, breaks into nodes, and the nodes scatter as the
   overlay lifts onto the network canvas. */
#intro{
  position:fixed;inset:0;z-index:999;background:var(--paper);
  display:grid;place-items:center;
  transition:opacity .5s ease,transform .5s ease;
}
#intro.done{opacity:0;transform:scale(1.03);pointer-events:none}
body.intro-lock{overflow:hidden}
.intro-in{display:flex;flex-direction:column;align-items:center}
.mk{width:min(34vmin,240px);height:auto;color:var(--ink);overflow:visible;display:block}
.mk .s{
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;
  stroke-dasharray:460;stroke-dashoffset:460;
  animation:mkDraw .95s cubic-bezier(.35,0,.15,1) forwards var(--d,0s),
            mkFade .45s ease forwards 1.9s;
}
@keyframes mkDraw{to{stroke-dashoffset:0}}
@keyframes mkFade{to{opacity:0}}
.mk .nd{
  fill:currentColor;stroke:none;opacity:0;
  transform-box:fill-box;transform-origin:center;
  animation:ndIn .28s ease forwards 1.55s,
            ndOut .85s cubic-bezier(.3,0,.2,1) forwards 2.0s;
}
@keyframes ndIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes ndOut{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.intro-word{
  margin-top:24px;text-align:center;opacity:0;
  animation:wordIn .7s cubic-bezier(.2,.7,.2,1) forwards 1.05s,
            mkFade .45s ease forwards 2.15s;
}
@keyframes wordIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.intro-name{
  font-size:12px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
  color:var(--ink);margin:0 0 9px;padding-left:.42em;
}
.intro-sub{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;
  font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin:0;
  padding-left:.24em;
}
.intro-skip{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-soft);opacity:0;
  animation:wordIn .6s ease forwards 1.6s;
}
@media(prefers-reduced-motion:reduce){
  .mk .s{stroke-dashoffset:0;animation:none}
  .mk .nd,.intro-skip{display:none}
  .intro-word{opacity:1;animation:none}
}

/* ---------- network canvas ----------
   Project nodes are cards; theme nodes are dots. Everything drifts slowly
   around its place in the graph, so the layout stays readable while it floats.
   Card proportions are the same as before, scaled to 0.70. */
/* the graph now takes the full width */
/* Three depth layers inside the canvas:
     back  (z1) — smaller, fainter project cards
     middle(z2) — the parametric dotted curve and the network edges
     front (z3) — full-size project cards
   `isolation` keeps this a self-contained stacking context so the layers
   cannot interleave with the page around them. */
.netwrap{
  position:relative;overflow:hidden;isolation:isolate;
  margin:18px var(--gut) 60px;
  height:clamp(560px, calc(100vh - 244px), 1040px);
}

/* the edge layer sits above the back cards, so it must not swallow their
   clicks — without this, cards behind the curve cannot be picked up */
.net-edges{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.net-edges line{stroke:var(--ink);stroke-width:1;opacity:.12;transition:opacity .3s,stroke-width .3s}
.net-edges line.hot{opacity:.8;stroke-width:1.4}
.net-edges line.cold{opacity:.035}
.node{
  position:absolute;left:0;top:0;transform-origin:50% 50%;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:opacity .3s;
}
.node.grabbing{cursor:grabbing}
/* depth layers */
/* Depth is driven per-frame from the engine, not by a fixed class: each card
   drifts continuously between the back layer (behind the curve, small and
   faint) and the front layer, so the field reads as real 3D space.
   The engine writes opacity with !important because the card entrance
   animation uses fill-mode:forwards, which outranks a normal declaration. */
.n-proj{transform-origin:50% 50%;transition:filter .4s ease}
.n-theme{z-index:3}
.n-proj:hover{z-index:5 !important;filter:none !important}
/* ---------- preview panel (stage one of the zoom) ---------- */
.preview{
  position:absolute;left:0;top:0;z-index:50;transform-origin:0 0;
  width:min(560px, 76%);
  background:var(--paper);border:1px solid var(--ink);
  padding:10px 10px 0;cursor:pointer;
  box-shadow:0 30px 80px rgba(0,0,0,.22);
  transition:transform .46s cubic-bezier(.22,.72,.2,1), opacity .34s ease;
  will-change:transform,opacity;
}
html[data-theme="dark"] .preview{box-shadow:0 30px 80px rgba(0,0,0,.65)}
.pv-shot{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--fill)}
.pv-meta{padding:16px 6px 20px}
.pv-name{margin:0;font-size:clamp(19px,2vw,26px);font-weight:200;letter-spacing:-.02em;line-height:1.12}
.pv-sub{margin:8px 0 0;font-size:var(--t-data);color:var(--ink-mid)}
.pv-line{
  display:flex;gap:20px;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--rule);
  font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:var(--t-label);
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mid);
}
.pv-cta{
  margin:10px 0 0;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;
  font-size:var(--t-label);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
}
/* everything else recedes while a preview is open */
.netwrap.previewing .node{opacity:.10 !important;transition:opacity .4s ease;pointer-events:none}
.netwrap.previewing .net-edges,.netwrap.previewing > .sky{opacity:.14;transition:opacity .4s ease}
@media(max-width:900px){
  .preview{width:88%}
  .pv-meta{padding:12px 4px 16px}
}
/* the cards carry an entrance animation with fill-mode:forwards, which
   outranks a normal declaration — so the faded states need !important */
.node.cold{opacity:.14 !important}
.node.dim{opacity:.07 !important;pointer-events:none}
.n-proj.cold,.n-proj.dim{filter:grayscale(1)}
.n-proj.cold .frame,.n-proj.dim .frame{background:var(--fill)}
.node{transition:opacity .32s ease,filter .32s ease}

/* project card node — 4:3 image, name, year */
.n-proj{
  width:var(--cw,150px);background:var(--paper);border:1px solid var(--rule-strong);
  padding:calc(var(--cw,150px) * .04) calc(var(--cw,150px) * .04) 0;
  opacity:0;animation:cardIn .6s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:calc(var(--i,0) * 70ms);
  transition:border-color var(--t),background-color var(--t),box-shadow var(--t),opacity .3s;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1}}
.n-proj .frame{
  position:relative;display:block;width:100%;aspect-ratio:4/3;
  background:var(--fill);overflow:hidden;
}
.n-proj .frame .shotimg,.n-proj .frame .ph{transition:transform .8s cubic-bezier(.2,.6,.2,1)}
.n-proj:hover .frame .shotimg,.n-proj:hover .frame .ph{transform:scale(1.05)}
.n-proj .frame::after{
  content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--ink);
  transition:width .45s cubic-bezier(.2,.7,.2,1);z-index:3;
}
.n-proj:hover .frame::after{width:100%}
.n-proj .c-name{
  display:block;margin:calc(var(--cw,150px) * .053) 1px 0;
  font-size:calc(var(--cw,150px) * .0733);font-weight:500;letter-spacing:-.01em;
  line-height:1.25;transition:color var(--t);
}
.n-proj .c-year{
  display:block;margin:calc(var(--cw,150px) * .027) 1px calc(var(--cw,150px) * .06);
  font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;
  font-size:calc(var(--cw,150px) * .05);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}
.n-proj:hover{border-color:var(--ink);z-index:60}
.n-proj.grabbing{border-color:var(--ink);box-shadow:0 18px 44px rgba(0,0,0,.20);z-index:80}
html[data-theme="dark"] .n-proj.grabbing{box-shadow:0 18px 44px rgba(0,0,0,.6)}
.n-proj.pinned{border-color:var(--ink)}
.n-proj img{pointer-events:none}

/* theme node */
.n-theme{width:2px}
.n-theme .dot{
  display:block;width:9px;height:9px;margin:0 auto;border-radius:50%;
  background:var(--paper);border:1px solid var(--ink-soft);
  transition:border-color var(--t),background-color var(--t),transform .3s cubic-bezier(.2,.7,.2,1);
}
.n-theme .cap{
  display:block;position:relative;left:50%;transform:translateX(-50%);
  margin-top:6px;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);transition:color var(--t);
}
.n-theme:hover .dot{background:var(--ink);border-color:var(--ink);transform:scale(1.5)}
.n-theme:hover .cap,.n-theme.on .cap{color:var(--ink)}
.n-theme.on .dot{background:var(--ink);border-color:var(--ink)}
.n-theme.pinned .dot{border-width:2px;border-color:var(--ink)}

/* ---------- parametric dot field ----------
   A scatter of still dots that periodically migrates into a set of
   swept parametric wave — the only pattern the background draws — holds,
   then disperses again. No
   twinkling: the movement is the whole event. */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;color:var(--ink)}
/* while it is the middle layer, the curve is scoped to the canvas */
.netwrap > .sky{position:absolute;z-index:2}
.sky svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky #skyRibWrap,.sky #skyExtraWrap{will-change:opacity}
.sky circle{fill:currentColor}
/* Twinkle is driven from the frame loop, not by CSS. Eighteen concurrent
   SVG keyframe animations cost ~30fps even when their values never changed;
   eighteen attribute writes per frame cost nothing. Dots are shared across
   six bands with random membership, so the shimmer still reads per-dot. */
/* the sweep is deliberately NOT animated: a continuous animation on this
   layer would repaint 2,496 dots every frame */
@media(prefers-reduced-motion:reduce){
  .sky circle,.sky .ribbon path{animation:none}
}
.sky .d-far  {opacity:.135}
.sky .d-near {opacity:.215}
.sky .d-extra{opacity:.155}
.sky .ribbon path{
  /* every dot is a zero-ish-length subpath with a round cap: explicit dot
     positions, and none of the cost of a dashed stroke */
  fill:none;stroke:currentColor;stroke-linecap:round;
}
.sky .ribbon .r1{stroke-width:1}
.sky .ribbon .r2{stroke-width:1.5}
.sky .ribbon .r3{stroke-width:2}
.sky .ribbon{opacity:.165}
html[data-theme="dark"] .sky .d-far  {opacity:.17}
html[data-theme="dark"] .sky .d-near {opacity:.285}
html[data-theme="dark"] .sky .d-extra{opacity:.20}
html[data-theme="dark"] .sky .ribbon{opacity:.225}

/* hidden on desktop; the phone layout switches it on */
.net-hint{
  position:absolute;left:2px;bottom:6px;z-index:5;pointer-events:none;display:none;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
}

/* keep the page above nothing in particular, but the header is fixed */
/* footer sits at the bottom even when a page is short */
.shell{
  /* the header is --nav-h tall PLUS a 1px bottom rule, or content tucks
     under the rule by a pixel */
  position:relative;z-index:1;padding-top:calc(var(--nav-h) + 1px);
  min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;
}
.shell > main{flex:1 0 auto}
.shell > footer{flex:0 0 auto}

/* ---------- real imagery ---------- */
.shotimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shotimg.fit{object-fit:contain;background:#ededed;padding:2.5%}
.idxbadge{
  position:absolute;left:12px;bottom:10px;z-index:2;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:var(--t-label);letter-spacing:.1em;
  color:#fff;text-shadow:0 1px 7px rgba(0,0,0,.6);
}
.shot-free{margin:42px 0;padding:0}
.duo .shot-free{margin:0}
.freeimg{width:100%;height:auto;display:block;background:var(--fill)}
.freeimg.fit{background:#ededed;padding:1.5%}
.phbox{position:relative;width:100%;aspect-ratio:16/9;background:var(--fill);overflow:hidden}

/* diagram sequence */
.seq{margin:var(--s-6) 0 0;border-top:1px solid var(--rule);padding-top:var(--s-3)}
.seq-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}
.seq-nav{display:flex;gap:18px;align-items:center}
.seq-nav button{font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--ink-soft);transition:color var(--t)}
.seq-nav button:hover{color:var(--ink)}
.seq-stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--fill);overflow:hidden}
.seq-slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.seq-slide.on{opacity:1}
/* one tick per step, so the length of the sequence is visible at a glance */
.seq-ticks{display:flex;gap:5px;margin-top:12px}
.seq-ticks i{flex:1;height:2px;background:var(--rule-strong);transition:background var(--t)}
.seq-ticks i.on{background:var(--ink)}
.seq-cap{
  display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr);
  gap:clamp(28px,4vw,80px);margin-top:16px;min-height:4.2em;
}
.seq-cap b{
  font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:var(--t-label);
  color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;padding-top:3px;
}
.seq-cap span{font-size:var(--t-body);font-weight:400;color:var(--ink-mid);line-height:1.72;max-width:62ch}

/* credits */
/* ---------- project page ---------- */
/* NB: the index headline is .hero — the project hero image must not share
   that name or it inherits overflow:hidden and the entrance animation, which
   collapsed it to 4px tall. */
.p-hero{
  position:relative;width:100%;height:clamp(320px, 58vh, 620px);
  overflow:hidden;background:var(--fill);
}
.p-hero .shotimg{width:100%;height:100%;object-fit:cover;display:block}

.title-block{

.tower-split-clean .seq-step-card b{

.portrait{margin:0 0 26px;position:relative;overflow:hidden;background:var(--fill);isolation:isolate}
/* the base image is the plain black-and-white portrait; the glitch only
   arrives in short bursts on two out-of-phase clocks, so it is sometimes
   a single hit, sometimes a double, and most of the time not there at all */
.portrait img{width:100%;height:auto;display:block;filter:grayscale(1) contrast(1.04)}
.portrait .gl{position:absolute;inset:0;pointer-events:none;opacity:0}
.portrait .gl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait .g1{mix-blend-mode:screen;animation:burstA 5.2s steps(1,end) infinite}
.portrait .g2{mix-blend-mode:multiply;animation:burstB 7.9s steps(1,end) infinite}
.portrait .g3{animation:burstC 11.7s steps(1,end) infinite}
/* short, sharp hits — roughly a third of a second each */
@keyframes burstA{
  0%,74%    {opacity:0;  clip-path:inset(100% 0 0 0); transform:translateX(0)}
  75%       {opacity:.95;clip-path:inset(13% 0 73% 0);transform:translateX(-10px)}
  77%       {opacity:.9; clip-path:inset(51% 0 35% 0);transform:translateX(8px)}
  78.5%     {opacity:0;  clip-path:inset(100% 0 0 0)}
  80.5%     {opacity:.9; clip-path:inset(30% 0 59% 0);transform:translateX(12px)}
  82%,100%  {opacity:0;  clip-path:inset(100% 0 0 0); transform:translateX(0)}
}
@keyframes burstB{
  0%,56%    {opacity:0;  clip-path:inset(100% 0 0 0); transform:translateX(0)}
  57.2%     {opacity:.85;clip-path:inset(40% 0 49% 0);transform:translateX(9px)}
  58.6%     {opacity:0;  clip-path:inset(100% 0 0 0)}
  60%       {opacity:.8; clip-path:inset(21% 0 66% 0);transform:translateX(-11px)}
  61.4%,100%{opacity:0;  clip-path:inset(100% 0 0 0); transform:translateX(0)}
}
/* a rare whole-frame hit */
@keyframes burstC{
  0%,91%    {opacity:0}
  91.8%     {opacity:.5}
  92.6%     {opacity:0}
  93.4%     {opacity:.3}
  94.2%,100%{opacity:0}
}
/* the scan sweep only travels during a burst */
.portrait .sweep{
  position:absolute;left:0;right:0;height:16%;pointer-events:none;z-index:3;opacity:0;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.16),transparent);
  animation:sweepY 5.2s linear infinite;
}
html[data-theme="dark"] .portrait .sweep{background:linear-gradient(to bottom,transparent,rgba(255,255,255,.10),transparent)}
@keyframes sweepY{
  0%,73.5%  {top:-18%;opacity:0}
  74%       {top:-18%;opacity:1}
  82%       {top:104%;opacity:1}
  82.5%,100%{top:104%;opacity:0}
}
.portrait::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
html[data-theme="dark"] .portrait::after{mix-blend-mode:screen;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
@media(prefers-reduced-motion:reduce){

  :root{--cw:92px}

  .index-head{padding:10px var(--gut) 12px}

  .n-proj{padding:5px 5px 0}

  .p-hero{height:clamp(220px, 42vh, 380px)}
  .prose{grid-template-columns:1fr;gap:14px}
  .prose-side{position:static}
  .prose .body-copy{columns:1}

  .share{padding-top:0}
  .facts{grid-template-columns:repeat(2,1fr)}

  .cols{grid-template-columns:1fr;gap:34px}

}

<script>
/* ---------- parametric dot field ---------- */
(function dotField(){
  const host = document.getElementById('sky');
  if(!host) return;
  const svgRib  = host.querySelector('#skyRib');    // heavy, repainted rarely
  const svgDots = host.querySelector('#skyDots');   // light, twinkles freely
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SPINES = 6, PER = 18, BASE = SPINES * PER;  // 108 dots at rest
  const SPLIT = 1, EXTRA = BASE * SPLIT;            // each splits in two
  const SLOTS = PER * (SPLIT + 1);
  const RIB = 26, RPT = 96;                         // swept lines, points per line

  // r runs 0..1 across the set, so the same wave can be sampled at any
  // density — six spines carry the dots, twenty-six lines carry the sweep.
  //
  // Every variant is the same construction and nothing else appears:
  //   midline drift  + band of lines fanned by a per-line phase offset,
  //   the band width modulated by an envelope so it pinches to a waist and
  //   opens out again. That is what makes the reference sweeps read.
  const TAU = Math.PI * 2;
  const WAVE = [
    {MID:.50, A:.30, F:1.05, S:.34, B:.10, F2:.55, P:.00, K:1.0, Q:.20},
    {MID:.49, A:.30, F:1.35, S:.46, B:.11, F2:.80, P:.35, K:1.5, Q:.55},
    {MID:.51, A:.34, F:0.80, S:.26, B:.08, F2:1.15,P:.60, K:1.2, Q:.00},
    {MID:.50, A:.28, F:1.70, S:.40, B:.12, F2:.60, P:.20, K:2.0, Q:.35},
    {MID:.49, A:.33, F:1.00, S:.54, B:.09, F2:.95, P:.80, K:1.0, Q:.62},
    {MID:.51, A:.31, F:1.25, S:.20, B:.12, F2:.45, P:.45, K:1.7, Q:.15}
  ];
  // Amplitude was a fraction of the frame HEIGHT, so a tall narrow phone
  // stretched the wave to ~4.5x its desktop slope. Tie it to WIDTH instead:
  // 0.497 leaves desktop pixel-identical. The 0.58 floor is a compromise —
  // strict correction would give a slope of 0.29 but leave the wave a thin
  // 24% band on a phone, so it trades a little slope for presence.
  let ampK = 1;
  function setAmp(w, h){
    ampK = Math.min(1, Math.max(0.58, 0.497 * (w / Math.max(1, h))));
  }
  const FAM = WAVE.map(v => (r,t) => {
    const env = .06 + .94*Math.abs(Math.sin(Math.PI*(t*v.K + v.Q)));
    return [
      .02 + t*.96,
      v.MID + v.B*ampK*Math.sin(TAU*(t*v.F2 + v.P))
            + v.A*ampK*env*Math.sin(TAU*(t*v.F + r*v.S))
    ];
  });

  const rnd = n => { const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); };
  // six twinkle bands, six periods that do not divide into each other
  const TWN = 6;
  const PER_S = [5.2, 6.7, 8.1, 9.4, 11.3, 12.6];
  const OFF_S = [-0.9, -2.6, -4.2, -1.7, -6.3, -3.4];
  const scatter = off => Array.from({length:BASE}, (_,i)=>[
    .02 + rnd(off + i*1.7)*.96,
    .03 + rnd(off + i*3.9 + 11)*.94
  ]);
  const spineR = i => (SPINES === 1 ? 0 : Math.floor(i/PER)/(SPINES-1));
  const curveBase  = f => Array.from({length:BASE},  (_,i)=>
    FAM[f](spineR(i), ((i%PER)*(SPLIT+1)) / (SLOTS-1)));
  const curveExtra = f => Array.from({length:EXTRA}, (_,j)=>{
    const i = Math.floor(j/SPLIT), k = j%SPLIT;
    return FAM[f](spineR(i), ((i%PER)*(SPLIT+1) + k + 1) / (SLOTS-1));
  });
  const parentOf = arr => Array.from({length:EXTRA}, (_,j)=>arr[Math.floor(j/SPLIT)]);

  let seed = 1, fam = 0;
  let from = scatter(seed), to = scatter(seed += 97);
  let cur = curveBase(fam), curE = curveExtra(fam);

  let W = 0, H = 0, baseEls = [], extraEls = [], ribEls = [], groups = [], wrap = null, ribWrap = null;
  let farIdx = [], nearIdx = [], exIdx = [], twBands = [];
  function build(){
    W = host.clientWidth || 1; H = host.clientHeight || 1;
    setAmp(W, H);
    let far = '', near = '', ex = '';
    const band = k => Math.floor(rnd(k*9.7+41) * TWN) % TWN;
    const open = g => `<g class="tw" data-tw="${g}">`;

    const farB = Array.from({length:TWN},()=>''), nearB = Array.from({length:TWN},()=>'');
    const exB  = Array.from({length:TWN},()=>'');
    farIdx = Array.from({length:TWN},()=>[]); nearIdx = Array.from({length:TWN},()=>[]);
    exIdx  = Array.from({length:TWN},()=>[]);
    for(let i=0;i<BASE;i++){
      const g = band(i), r = 0.8 + rnd(i*5.3+29)*1.0;
      const c = `<circle r="${r.toFixed(2)}"/>`;
      if(i % 3 === 0){ nearB[g] += c; nearIdx[g].push(i); }
      else           { farB[g]  += c; farIdx[g].push(i); }
    }
    for(let j=0;j<EXTRA;j++){
      const g = band(j+911);
      exB[g] += `<circle r="${(0.65 + rnd(j*7.1+53)*0.75).toFixed(2)}"/>`;
      exIdx[g].push(j);
    }
    for(let g=0; g<TWN; g++){
      far  += open(g) + farB[g]  + '</g>';
      near += open(g) + nearB[g] + '</g>';
      ex   += open(g) + exB[g]   + '</g>';
    }
    svgRib.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svgDots.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svgRib.innerHTML =
        `<g id="skyRibWrap" opacity="0"><g class="ribbon">`
      + `<path class="r1"/><path class="r2"/><path class="r3"/></g></g>`;
    svgDots.innerHTML =
        `<g class="d-far" data-par="6">${far}</g>`
      + `<g class="d-near" data-par="15">${near}</g>`
      + `<g id="skyExtraWrap" data-par="10" opacity="0"><g class="d-extra">${ex}</g></g>`;
    // circles now sit inside band groups, so map them back by band order
    const f = [...svgDots.querySelectorAll('.d-far circle')];
    const n = [...svgDots.querySelectorAll('.d-near circle')];
    const e = [...svgDots.querySelectorAll('.d-extra circle')];
    baseEls = new Array(BASE); extraEls = new Array(EXTRA);
    let fi = 0, ni = 0, ei = 0;
    for(let g=0; g<farIdx.length; g++){
      for(const i of farIdx[g])  baseEls[i]  = f[fi++];
      for(const i of nearIdx[g]) baseEls[i]  = n[ni++];
      for(const j of exIdx[g])   extraEls[j] = e[ei++];
    }
    ribEls   = [svgRib.querySelector('.ribbon .r1'),
                svgRib.querySelector('.ribbon .r2'),
                svgRib.querySelector('.ribbon .r3')];
    wrap     = svgDots.querySelector('#skyExtraWrap');
    ribWrap  = svgRib.querySelector('#skyRibWrap');
    groups   = [...svgDots.querySelectorAll('[data-par]')].map(g=>({g,p:+g.dataset.par,x:0,y:0}));
    twBands  = PER_S.map((per,g)=>({
      els: [...svgDots.querySelectorAll(`.tw[data-tw="${g}"]`)],
      per, off: OFF_S[g], last: -1
    }));
  }
  build();

  const STEPS = [
    {a:'scatter',  ms:5200},
    {a:'gather',   ms:3600},
    {a:'formed',   ms:2800},
    {a:'disperse', ms:3600}
  ];
  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  let step = 0, t0 = performance.now(), ribDrawnFor = -1, tick = 0;

  const put = (els, pts) => {
    for(let i=0;i<els.length;i++){
      const e = els[i], p = pts[i]; if(!e || !p) continue;
      const x = Math.round(p[0]*W*2)/2, y = Math.round(p[1]*H*2)/2;
      if(e._x !== x){ e.setAttribute('cx', x); e._x = x; }
      if(e._y !== y){ e.setAttribute('cy', y); e._y = y; }
    }
  };
  const mix = (A,B,k) => { const o=new Array(A.length);
    for(let i=0;i<A.length;i++) o[i]=[A[i][0]+(B[i][0]-A[i][0])*k, A[i][1]+(B[i][1]-A[i][1])*k];
    return o; };

  // The sweep is drawn as dots, sorted into three sizes so the ends of each
  // line taper away. Positions are computed once per family — the animation
  // only fades the group, so this costs nothing per frame.
  function drawRibbon(){
    if(ribDrawnFor === fam) return;
    const f = FAM[fam], d = ['','',''];
    for(let i=0;i<RIB;i++){
      const r = RIB === 1 ? 0 : i/(RIB-1);
      // stagger alternate lines by half a step, or every line samples the
      // same positions and the sweep reads as a rigid grid
      const off = (i % 2) * .5;
      for(let j=0;j<RPT;j++){
        const t = Math.min(1, (j + off)/(RPT-1)), p = f(r, t);
        const taper = Math.sin(Math.PI * t);              // small at the ends
        const band = taper < .42 ? 0 : (taper < .78 ? 1 : 2);
        d[band] += `M${(p[0]*W).toFixed(1)} ${(p[1]*H).toFixed(1)}l.01 0`;
      }
    }
    for(let k=0;k<3;k++) ribEls[k].setAttribute('d', d[k]);
    ribDrawnFor = fam;
  }

  function render(phase, k){
    if(phase === 'scatter'){
      put(baseEls, from);
      wrap.setAttribute('opacity','0'); ribWrap.setAttribute('opacity','0');
      return;
    }
    drawRibbon();
    if(phase === 'formed'){
      put(baseEls, cur); put(extraEls, curE);
      wrap.setAttribute('opacity','1'); ribWrap.setAttribute('opacity','1');
      return;
    }
    if(phase === 'gather'){
      put(baseEls, mix(from, cur, k));
      put(extraEls, mix(parentOf(from), curE, k));
      wrap.setAttribute('opacity', k.toFixed(3));
      ribWrap.setAttribute('opacity', (k*k).toFixed(3));   // the sweep arrives late
      return;
    }
    put(baseEls, mix(cur, to, k));
    put(extraEls, mix(curE, parentOf(to), k));
    wrap.setAttribute('opacity', (1-k).toFixed(3));
    ribWrap.setAttribute('opacity', ((1-k)*(1-k)).toFixed(3));
  }
  render('scatter', 0);

  let mx=0,my=0,tmx=0,tmy=0;
  window.addEventListener('pointermove', e=>{
    tmx = (e.clientX/Math.max(1,innerWidth) - .5)*2;
    tmy = (e.clientY/Math.max(1,innerHeight) - .5)*2;
  }, {passive:true});
  window.addEventListener('resize', ()=>{
    build(); ribDrawnFor = -1;              // amplitude changed, so redraw the sweep
    cur = curveBase(fam); curE = curveExtra(fam);
    render('scatter', 0);
  });

  if(reduce) return;

  (function frame(now){
    mx += (tmx-mx)*.03; my += (tmy-my)*.03;
    for(const L of groups){
      if(L.g.getAttribute('opacity') === '0') continue;   // nothing to move
      L.x += ((-mx*L.p)-L.x)*.03;
      L.y += ((-my*L.p*.5)-L.y)*.03;
      const tf = `translate(${L.x.toFixed(1)},${L.y.toFixed(1)})`;
      if(L._tf !== tf){ L.g.setAttribute('transform', tf); L._tf = tf; }
    }
    // Twinkle: six sine clocks. Periods are 5-12s, so this is evaluated every
    // third frame and quantised, which cuts the repaints without any visible
    // stepping — updating it every frame cost roughly half the frame rate.
    if((tick++ % 3) === 0){
      for(const t of twBands){
        const v = .6 + .4 * (.5 + .5*Math.sin((now/1000 + t.off) * (Math.PI*2 / t.per)));
        const q = Math.round(v*25)/25;
        if(q !== t.last){ t.last = q; for(const e of t.els) e.setAttribute('opacity', q); }
      }
    }

    const s = STEPS[step], el = now - t0;
    render(s.a, ease(Math.min(1, el/s.ms)));
    if(el >= s.ms){
      if(s.a === 'disperse'){
        from = to; to = scatter(seed += 97);
        fam = (fam + 1) % FAM.length;
        cur = curveBase(fam); curE = curveExtra(fam);
      }
      step = (step + 1) % STEPS.length;
      t0 = now;
    }
    requestAnimationFrame(frame);
  })(performance.now());
})();

/* ---------- opening sequence ---------- */
(function intro(){
  const el = document.getElementById('intro');
  if(!el) return;
  let seen = false;
  try{ seen = sessionStorage.getItem('sks-intro') === '1'; }catch(e){}
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(seen){ el.remove(); return; }
  try{ sessionStorage.setItem('sks-intro','1'); }catch(e){}

  document.body.classList.add('intro-lock');

  // each node flies out along its own heading from the centre of the mark
  el.querySelectorAll('.nd').forEach(n=>{
    const cx = +n.getAttribute('cx'), cy = +n.getAttribute('cy');
    let dx = cx - 100, dy = cy - 110;
    const d = Math.hypot(dx, dy) || 1;
    const reach = 120 + Math.random() * 90;
    n.style.setProperty('--dx', (dx / d * reach).toFixed(1) + 'px');
    n.style.setProperty('--dy', (dy / d * reach).toFixed(1) + 'px');
  });

  let finished = false;
  function finish(){
    if(finished) return;
    finished = true;
    el.classList.add('done');
    document.body.classList.remove('intro-lock');
    setTimeout(()=>el.remove(), 600);
  }
  const t = setTimeout(finish, reduce ? 700 : 2180);   // overlaps the scatter, so there is no empty beat
  const skip = () => { clearTimeout(t); finish(); };
  el.addEventListener('click', skip);
  window.addEventListener('keydown', skip, {once:true});
  window.addEventListener('wheel', skip, {once:true, passive:true});
  window.addEventListener('touchstart', skip, {once:true, passive:true});
})();

const root = document.documentElement;
const lightBtn = document.getElementById('lightBtn');
const darkBtn  = document.getElementById('darkBtn');
const themeMeta = document.getElementById('themeColor');

function setTheme(mode,persist){
  root.setAttribute('data-theme',mode);
  lightBtn.setAttribute('aria-pressed', mode==='light');
  darkBtn.setAttribute('aria-pressed', mode==='dark');
  themeMeta.setAttribute('content', mode==='dark' ? '#0c0c0c' : '#ffffff');
  if(persist){ try{ localStorage.setItem('sks-theme',mode); }catch(e){} }
}
(function initTheme(){
  let saved=null;
  try{ saved = localStorage.getItem('sks-theme'); }catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'), false);
})();
lightBtn.addEventListener('click',()=>setTheme('light',true));
darkBtn.addEventListener('click',()=>setTheme('dark',true));

function ph(file,idx){

let towerMatrixCache = null;
function applyTowerMatrixTransparency(rootEl){
  const matImg = (rootEl || document).querySelector('.tower-crop-matrix-in img');
  if(!matImg) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(towerMatrixCache){
    matImg.src = isDark ? towerMatrixCache.dark : towerMatrixCache.light;
    matImg.classList.add('transparent-ready');
    return;
  }
  const srcImg = new Image();
  srcImg.crossOrigin = 'anonymous';
  srcImg.onload = () => {
    const isHd = srcImg.naturalWidth > 1000;
    const sx = isHd ? 0 : 6, sy = isHd ? 0 : 9;
    const sw = isHd ? srcImg.naturalWidth : 736, sh = isHd ? srcImg.naturalHeight : (srcImg.naturalHeight - 9);
    const makeUrl = dark => {
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      const ctx = c.getContext('2d');
      ctx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
      const id = ctx.getImageData(0, 0, sw, sh), d = id.data;
      for(let p = 0; p < d.length; p += 4){
        const r = d[p], g = d[p+1], b = d[p+2];
        const sat = Math.max(r, g, b) - Math.min(r, g, b);
        const lum = (r + g + b) / 3;
        if(sat < 16 && lum > 224){
          d[p+3] = Math.round(Math.max(0, Math.min(1, (238 - lum) / 14)) * 255);
        }
        if(dark && d[p+3] > 0 && sat < 24){
          const inv = Math.min(245, Math.round(255 - lum * 0.82));
          d[p] = inv; d[p+1] = inv; d[p+2] = inv;
        }
      }
      ctx.putImageData(id, 0, 0);
      return c.toDataURL('image/png');
    };
    towerMatrixCache = { light: makeUrl(false), dark: makeUrl(true) };
    const nowDark = document.documentElement.getAttribute('data-theme') === 'dark';
    matImg.src = nowDark ? towerMatrixCache.dark : towerMatrixCache.light;
    matImg.classList.add('transparent-ready');
  };
  srcImg.src = IMG['tower-matrix.jpg'];
}
lightBtn.addEventListener('click', () => setTimeout(() => applyTowerMatrixTransparency(app), 0));

/* ---------- force-directed network ---------- */
let resetLayout = null;
let netStop = null;

function initNetwork(){
  if(netStop){ netStop(); netStop = null; }
  const wrap = document.getElementById('net');
  if(!wrap) return;
  const svg = wrap.querySelector('.net-edges');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = wrap.clientWidth, H = wrap.clientHeight;

  // build nodes: one per project, one per shared theme
  const nodes = [];
  // alternate front / back so neither layer clusters on one side
  const BACK = new Set([1,3,5]);          // three of the seven sit behind the curve
  PROJECTS.forEach((p,i)=>{
    const a = (i / PROJECTS.length) * Math.PI * 2;
    nodes.push({
      id:p.slug, type:'proj', label:p.title, slug:p.slug, file:p.files[0], i,
      layer: BACK.has(i) ? 'back' : 'front',
      year:(p.facts.find(f=>f[0]==='Year')||[])[1] || '',
      cat:p.cat,
      x: W/2 + Math.cos(a) * W*0.32, y: H/2 + Math.sin(a) * H*0.33,
      vx:0, vy:0, r:98
    });
  });
  Object.keys(THEMES).forEach((k,i)=>{
    const a = (i / Object.keys(THEMES).length) * Math.PI * 2 + .4;
    nodes.push({
      id:k, type:'theme', label:THEMES[k],
      x: W/2 + Math.cos(a) * W*0.12, y: H/2 + Math.sin(a) * H*0.13,
      vx:0, vy:0, r:26
    });
  });
  // per-node wander: amplitude, period and phase all differ, so the field
  // never falls into step. This is what keeps the graph floating once it settles.
  const rnd = k => { const s = Math.sin(k * 91.7) * 43758.5453; return s - Math.floor(s); };
  nodes.forEach((n,i)=>{
    const big = n.type === 'proj';
    const room = Math.min(1, Math.max(.5, (wrap.clientWidth || 1200) / 1460));
    // the back layer is further away, so it travels less — parallax by depth
    const depth = n.layer === 'back' ? 0.68 : 1;
    n.ax = ((big ? 16 : 11) + rnd(i * 3.1) * (big ? 14 : 9)) * room * depth;
    n.ay = ((big ? 13 : 9)  + rnd(i * 5.7) * (big ? 12 : 8)) * room * depth;
    n.fx = 0.00016 + rnd(i * 7.3) * 0.00013;                  // ~40–110s per cycle
    n.fy = 0.00013 + rnd(i * 9.1) * 0.00011;
    n.px = rnd(i * 2.9) * 6.283;
    n.py = rnd(i * 4.7) * 6.283;
    n.ox = 0; n.oy = 0;
  });
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));

  const links = [];
  Object.entries(PROJECT_THEMES).forEach(([slug,themes])=>{
    themes.forEach(t=>{ if(byId[slug] && byId[t]) links.push({a:byId[slug], b:byId[t]}); });
  });

  // adjacency, so hovering can dim everything unrelated
  const near = {};
  nodes.forEach(n=> near[n.id] = new Set([n.id]));
  links.forEach(l=>{ near[l.a.id].add(l.b.id); near[l.b.id].add(l.a.id); });

  // paint
  svg.innerHTML = links.map(()=>'<line/>').join('');
  const lineEls = [...svg.querySelectorAll('line')];
  nodes.forEach(n=>{
    const el = document.createElement(n.type === 'proj' ? 'a' : 'button');
    el.className = 'node ' + (n.type === 'proj' ? 'n-proj' : 'n-theme');
    el.dataset.id = n.id;
    if(n.type === 'proj'){
      el.href = '#/project/' + n.slug;
      el.setAttribute('data-link','');
      el.style.setProperty('--i', n.i);
      el.classList.add('layer-' + n.layer);
      el.innerHTML = `<span class="frame">${ph(n.file)}</span>`
                   + `<span class="c-name">${n.label}</span>`
                   + `<span class="c-year">${n.year}</span>`;
    } else {
      el.innerHTML = `<span class="dot"></span><span class="cap">${n.label}</span>`;
    }
    wrap.appendChild(el);
    n.el = el;
  });

  // Where the node's coordinate actually lands on the element:
  //  - a project card is centred on it
  //  - a theme's DOT is centred on it, so the edges meet the circle itself;
  //    its label then hangs below, which makes the footprint asymmetric.
  const BACK_SCALE = 0.62, BACK_OPACITY = 0.42;
  nodes.forEach(n=>{
    if(n.type === 'proj'){
      // each card runs its own slow depth clock, 34-58s per round trip, so the
      // field never pulses in unison and no two cards swap at the same moment
      n.dPer = 34000 + rnd(n.i * 6.7) * 24000;
      n.dPh  = rnd(n.i * 3.3) * Math.PI * 2;
      n.depth = n.layer === 'back' ? 0 : 1;      // starting side
      n.scale = 1;                               // bounds use full size
    }
    const cap = n.el.querySelector('.cap');
    const dot = n.el.querySelector('.dot');
    // anchorX/anchorY, not ox/oy — the drift owns those names.
    // For a theme the anchor is the dot's real centre, measured rather than
    // assumed: `margin:0 auto` cannot centre a 9px dot in a 2px parent.
    if(n.type === 'proj'){
      // the element is scaled visually, so its footprint shrinks with it
      n.anchorX = n.el.offsetWidth / 2;
      n.anchorY = n.el.offsetHeight / 2;
      n.hw = n.anchorX;                 // full size, so a card growing to the
      n.up = n.anchorY; n.dn = n.anchorY;  // front can never cross the frame

    } else {
      const eb = n.el.getBoundingClientRect();
      const db = dot ? dot.getBoundingClientRect() : eb;
      n.anchorX = (db.left - eb.left) + db.width / 2;
      n.anchorY = (db.top  - eb.top)  + db.height / 2;
      n.hw = Math.max(cap ? cap.offsetWidth / 2 : 0, db.width / 2 + 2);
      n.up = n.anchorY;
      n.dn = Math.max(n.el.offsetHeight - n.anchorY, db.height / 2);
    }
    n.hh = (n.up + n.dn) / 2;
  });

  // ---- interaction ----
  let held = null, grabX = 0, grabY = 0, moved = 0, pinned = null;

  // A card drifting under a STATIONARY pointer used to register as :hover and
  // grow on its own. Hover is now latched only when the pointer actually moves:
  // the card coming to you does nothing, only you going to the card counts.
  let hoverId = null;
  wrap.addEventListener('pointermove', e => {
    const c = e.target && e.target.closest ? e.target.closest('.n-proj') : null;
    hoverId = c ? c.dataset.id : null;
  });
  wrap.addEventListener('pointerleave', () => { hoverId = null; });

  // the wordmark in the header is the reset control
  resetLayout = () => {
    nodes.forEach(n=>{ n.fixed = false; n.relX = n.relY = undefined; n.el.classList.remove('pinned'); });
    fitted = false; alpha = Math.max(alpha, .5);
    wake(true);
  };

  function applyFilter(){
    nodes.forEach(n=>{
      n.el.classList.toggle('dim',
        n.type === 'proj' && activeFilter !== 'all' && n.cat !== activeFilter);
    });
  }
  applyFilter();

  function highlight(id){
    const set = id ? near[id] : null;
    nodes.forEach(n=>{
      n.el.classList.toggle('cold', !!set && !set.has(n.id));
      n.el.classList.toggle('lit',  !!set && set.has(n.id));   // phone shows the label
    });
    lineEls.forEach((el,i)=>{
      const l = links[i];
      const hot = set && (set.has(l.a.id) && set.has(l.b.id)) && (l.a.id === id || l.b.id === id);
      el.classList.toggle('hot', !!hot);
      el.classList.toggle('cold', !!set && !hot);
    });
  }

  nodes.forEach(n=>{
    const el = n.el;
    el.addEventListener('pointerenter', ()=>{ if(!held && !pinned) highlight(n.id); });
    el.addEventListener('pointerleave', ()=>{ if(!held && !pinned) highlight(null); });
    el.addEventListener('pointerdown', e=>{
      if(e.button !== 0) return;
      e.preventDefault();
      held = n; moved = 0;
      const r = wrap.getBoundingClientRect();
      grabX = (e.clientX - r.left) - n.x;
      grabY = (e.clientY - r.top)  - n.y;
      el.setPointerCapture(e.pointerId);
      el.classList.add('grabbing');
      wake(true);
    });
    el.addEventListener('pointermove', e=>{
      if(held !== n) return;
      const r = wrap.getBoundingClientRect();
      const nx = (e.clientX - r.left) - grabX;
      const ny = (e.clientY - r.top)  - grabY;
      moved += Math.abs(nx - n.x) + Math.abs(ny - n.y);
      n.x = nx; n.y = ny; n.vx = 0; n.vy = 0;
      wake(true);
    });
    const end = e => {
      if(held !== n) return;
      held = null;
      el.classList.remove('grabbing');
      try{ el.releasePointerCapture(e.pointerId); }catch(_){}
      const DRAG_MIN = matchMedia('(pointer: coarse)').matches ? 12 : 5;
      if(moved >= DRAG_MIN){
        n.fixed = true;                       // dropped nodes stay where you put them
        n.tx = n.x; n.ty = n.y;               // so any later glide leaves it alone
        n.relX = n.x / W; n.relY = n.y / H;   // survive a resize proportionally
        el.classList.add('pinned');
        el.dataset.drag = '1';
        setTimeout(()=>{ delete el.dataset.drag; }, 60);
      }
      wake(true);
    };
    el.addEventListener('click', e=>{
      if(el.dataset.drag){ e.preventDefault(); e.stopPropagation(); return; }  // it was a drag
      if(n.type === 'proj'){
        // First click opens a preview — the project photo, name and dates.
        // Clicking the preview again opens the full project page.
        e.preventDefault(); e.stopPropagation();
        if(matchMedia('(prefers-reduced-motion: reduce)').matches){
          location.hash = '#/project/' + n.slug; return;
        }
        openPreview(n);
        return;
      }
      if(n.type === 'theme'){                 // tap a thread to hold it open
        e.preventDefault(); e.stopPropagation();
        pinned = pinned === n.id ? null : n.id;
        nodes.forEach(m=> m.el.classList.toggle('on', m.type==='theme' && m.id===pinned));
        highlight(pinned);
      }
    });

    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });

  // once the layout has resolved, stretch it to use the whole frame — the
  // solver settles into a cluster narrower than the canvas on its own
  let fitted = false, gliding = false;
  function fitToFrame(){
    // anything the visitor placed by hand is left exactly where they put it;
    // only the free nodes get rescaled to fill the frame
    const free = nodes.filter(n=>!n.fixed);
    if(!free.length){ fitted = true; return; }
    let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
    for(const n of free){
      x0 = Math.min(x0, n.x - n.hw); x1 = Math.max(x1, n.x + n.hw);
      y0 = Math.min(y0, n.y - n.up); y1 = Math.max(y1, n.y + n.dn);
    }
    const bw = x1 - x0, bh = y1 - y0;
    if(!(bw > 1 && bh > 1)) return;
    const M = 26;                                   // room for drift
    // scale the axes independently: only positions move, so no card distorts,
    // and a graph has no correct aspect ratio to preserve
    let sx = (W - M*2) / bw, sy = (H - M*2) / bh;
    sx = Math.min(Math.max(sx, 0.4), 3.2);
    sy = Math.min(Math.max(sy, 0.4), 3.2);
    if(!isFinite(sx) || !isFinite(sy)) return;
    const bx = (x0 + x1) / 2, by = (y0 + y1) / 2;
    for(const n of nodes){
      if(n.fixed){ n.tx = n.x; n.ty = n.y; continue; }
      n.tx = W/2 + (n.x - bx) * sx;
      n.ty = H/2 + (n.y - by) * sy;
    }
    // stretching the axes can leave two cards touching — push those apart
    const cards = nodes.filter(n=>n.type === 'proj' && !n.fixed);
    for(let pass=0; pass<24; pass++){
      let moved = false;
      for(let i=0;i<cards.length;i++){
        for(let j=i+1;j<cards.length;j++){
          const a = cards[i], c = cards[j];
          // leave room for the drift so they cannot collide later either
          const ox = (a.hw + c.hw + 10 + (a.ax + c.ax) * .85) - Math.abs(a.tx - c.tx);
          const oy = (a.hh + c.hh + 10 + (a.ay + c.ay) * .85) - Math.abs(a.ty - c.ty);
          if(ox > 0 && oy > 0){                     // overlapping in both axes
            const push = (ox < oy ? ox : oy) / 2 + .5;
            if(ox < oy){ const s = a.tx <= c.tx ? -1 : 1; a.tx += push*s; c.tx -= push*s; }
            else       { const s = a.ty <= c.ty ? -1 : 1; a.ty += push*s; c.ty -= push*s; }
            moved = true;
          }
        }
      }
      if(!moved) break;
    }
    for(const n of nodes){
      n.tx = Math.min(Math.max(n.tx, n.hw + 10), W - n.hw - 10);
      n.ty = Math.min(Math.max(n.ty, n.up + 10), H - n.dn - 12);
    }
    fitted = true; gliding = true;                  // eased into place, not teleported
  }

  // ---- preview panel: stage one of the zoom ----
  let preview = null;
  function closePreview(){
    if(!preview) return;
    const {el, node} = preview;
    const r = node.el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    el.style.transform = `translate(${r.left-w.left}px, ${r.top-w.top}px) scale(${r.width/el.offsetWidth})`;
    el.style.opacity = '0';
    wrap.classList.remove('previewing');
    const p = preview; preview = null;
    setTimeout(()=>{ if(p.el.parentElement) p.el.remove(); }, 420);
  }
  function openPreview(n){
    if(preview){ closePreview(); return; }
    const proj = PROJECTS.find(p => p.slug === n.slug);
    const from = n.el.getBoundingClientRect(), box = wrap.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'preview';
    const yr   = (proj.facts.find(f=>f[0]==='Year')||[])[1] || '';
    const type = (proj.facts.find(f=>f[0]==='Type'||f[0]==='Typology')||[])[1] || '';
    el.innerHTML =
        `<div class="pv-shot">${ph(proj.files[0])}</div>`
      + `<div class="pv-meta">`
      +   `<p class="pv-name">${proj.title}</p>`
      +   `<p class="pv-sub">${proj.place}</p>`
      +   `<p class="pv-line"><span>${yr}</span><span>${type}</span></p>`
      +   `<p class="pv-cta">Click again to open the project</p>`
      + `</div>`;
    wrap.appendChild(el);
    // start exactly on the card, then glide to the centre
    const W2 = el.offsetWidth, H2 = el.offsetHeight;
    el.style.transform = `translate(${from.left-box.left}px, ${from.top-box.top}px) scale(${from.width/W2})`;
    el.style.opacity = '0';
    void el.offsetWidth;
    el.style.transform = `translate(${(box.width-W2)/2}px, ${(box.height-H2)/2}px) scale(1)`;
    el.style.opacity = '1';
    wrap.classList.add('previewing');
    preview = {el, node:n};
    el.addEventListener('click', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      el.style.transform = `translate(${(box.width-W2)/2}px, ${(box.height-H2)/2}px) scale(1.12)`;
      el.style.opacity = '0';
      setTimeout(()=>{ location.hash = '#/project/' + n.slug; }, 260);
    });
  }
  wrap.addEventListener('pointerdown', e=>{
    if(preview && !e.target.closest('.preview') && !e.target.closest('.n-proj')) closePreview();
  });
  window.addEventListener('keydown', e=>{ if(e.key === 'Escape') closePreview(); });

  // ---- simulation ----
  // alpha cools from 1 to 0 so the layout actually converges; dragging reheats it
  let raf = 0, sleeping = false, alpha = 1;
  function wake(reheat){
    if(reheat) alpha = Math.max(alpha, 0.45);
    if(sleeping){ sleeping = false; raf = requestAnimationFrame(step); }
  }

  function step(){
    alpha *= 0.978;
    const solving = alpha > 0.006 || held;
    if(solving){
    // repulsion
    for(let i = 0; i < nodes.length; i++){
      for(let j = i+1; j < nodes.length; j++){
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy || 0.01;
        const min = (a.r + b.r);
        const f = ((min * min * 3.2) / d2) * alpha;
        const d = Math.sqrt(d2);
        const ux = dx/d, uy = dy/d;
        a.vx -= ux*f; a.vy -= uy*f;
        b.vx += ux*f; b.vy += uy*f;
      }
    }
    // springs
    for(const l of links){
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d - 232) * 0.014 * alpha;
      const ux = dx/d, uy = dy/d;
      l.a.vx += ux*f; l.a.vy += uy*f;
      l.b.vx -= ux*f; l.b.vy -= uy*f;
    }
    }
    if(!solving && !fitted) fitToFrame();
    // gentle centring + integrate
    for(const n of nodes){
      if(!solving) break;
      n.vx += (W/2 - n.x) * 0.0014 * alpha;
      n.vy += (H/2 - n.y) * 0.0014 * alpha;
      if(n === held || n.fixed){ n.vx = 0; n.vy = 0; }
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.min(Math.max(n.x, n.hw + 10), W - n.hw - 10);
      n.y = Math.min(Math.max(n.y, n.up + 10), H - n.dn - 12);
    }

    // ease into the fitted layout rather than jumping to it
    if(gliding){
      let far = false;
      for(const n of nodes){
        if(n.fixed || n === held) continue;
        n.x += (n.tx - n.x) * .042;
        n.y += (n.ty - n.y) * .042;
        if(Math.abs(n.tx - n.x) > .4 || Math.abs(n.ty - n.y) > .4) far = true;
      }
      if(!far) gliding = false;
    }

    // ---- the float: a slow lissajous around each node's place in the graph ----
    const t = performance.now();
    for(const n of nodes){
      const still = (n === held) || (n.type === 'proj' ? n.id === hoverId : n.el.matches(':hover'));
      if(!still && !reduce){
        n.ox += ((Math.sin(t * n.fx + n.px) * n.ax) - n.ox) * 0.04;
        n.oy += ((Math.cos(t * n.fy + n.py) * n.ay) - n.oy) * 0.04;
      }
      n.rx = n.x + n.ox;
      n.ry = n.y + n.oy;
      n.rx = Math.min(Math.max(n.rx, n.hw + 4), W - n.hw - 4);
      n.ry = Math.min(Math.max(n.ry, n.up + 4), H - n.dn - 6);
      if(n.type === 'proj'){
        // 0 = furthest back, 1 = front. Smoothstepped so cards linger at each
        // depth rather than sweeping through the middle at constant speed.
        const raw = reduce ? (n.layer === 'back' ? 0 : 1)
                           : (Math.sin(t / n.dPer * Math.PI * 2 + n.dPh) + 1) / 2;
        const d = raw*raw*(3 - 2*raw);
        n.depth = d;
        // A card drifting under a stationary cursor used to snap to full size,
        // which read as the card expanding by itself. The lift is now eased, so
        // hovering grows it gently and a drift-by barely registers.
        const held  = n.el.classList.contains('grabbing');
        const hover = (n.id === hoverId);
        const want  = (held || hover) ? 1 : d;
        n.lift = n.lift === undefined ? want : n.lift + (want - n.lift) * (held ? 0.22 : 0.055);
        const lift = n.zoom ? 1 : n.lift;
        n.scale = (BACK_SCALE + (1 - BACK_SCALE) * lift) * (n.zoom ? n.zoomScale : 1);
        const op = BACK_OPACITY + (1 - BACK_OPACITY) * lift;
        // inline !important beats the stylesheet's !important, so the depth
        // opacity must be REMOVED when a card is traced out — otherwise the
        // stale value keeps it lit while .cold tries to dim it
        if(n.el.classList.contains('cold') || n.el.classList.contains('dim')){
          if(n.el.style.opacity) n.el.style.removeProperty('opacity');
        } else {
          n.el.style.setProperty('opacity', op.toFixed(3), 'important');
        }
        n.el.style.filter = lift > .8 ? 'none' : `grayscale(${((1-lift)*0.4).toFixed(2)})`;
        // crossing the curve: below it while receding, above it while advancing
        n.el.style.zIndex = n.zoom ? 40 : (held ? 6 : (lift < .5 ? 1 : 3));
      }
      const sc = n.scale || 1;
      n.el.style.transform =
        `translate(${(n.rx - n.anchorX).toFixed(1)}px, ${(n.ry - n.anchorY).toFixed(1)}px)`
        + (sc !== 1 ? ` scale(${sc.toFixed(3)})` : '');
    }
    lineEls.forEach((el,i)=>{
      const l = links[i];
      el.setAttribute('x1', l.a.rx.toFixed(1)); el.setAttribute('y1', l.a.ry.toFixed(1));
      el.setAttribute('x2', l.b.rx.toFixed(1)); el.setAttribute('y2', l.b.ry.toFixed(1));
    });
    // the layout stops solving, but the float keeps running
    raf = requestAnimationFrame(step);
  }

  if(reduce){ for(let i=0;i<400;i++){ sleeping = false; step(); cancelAnimationFrame(raf); } }
  else step();

  const onResize = () => {
    const pw = W, ph = H;
    W = wrap.clientWidth; H = wrap.clientHeight;
    if(!(pw > 0 && ph > 0)) return;
    // a placed card keeps its position relative to the frame instead of
    // being swept back into the auto layout
    for(const n of nodes){
      if(!n.fixed) continue;
      const rx = n.relX !== undefined ? n.relX : n.x / pw;
      const ry = n.relY !== undefined ? n.relY : n.y / ph;
      n.x = Math.min(Math.max(rx * W, n.hw + 10), W - n.hw - 10);
      n.y = Math.min(Math.max(ry * H, n.up + 10), H - n.dn - 12);
      n.tx = n.x; n.ty = n.y;
    }
    fitted = false; alpha = Math.max(alpha, 0.35);   // re-resolve the free ones
    wake(true);
  };
  window.addEventListener('resize', onResize);
  netStop = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    if(preview && preview.el.parentElement) preview.el.remove();
    preview = null;
  };
}

/* ---------- router ---------- */
function route(){
  const hash = location.hash || '#/';
  let html, nav='index';
  if(hash.startsWith('#/project/')){ html = viewProject(hash.split('/')[2]); }
  else if(hash === '#/about'){ html = viewAbout(); nav='about'; }
  else if(hash === '#/services'){ html = viewServices(); nav='services'; }
  else if(hash === '#/contact'){ html = viewContact(); nav='contact'; }
  else { html = viewIndex(); }
  // The curve lives inside the canvas on the projects view, so it must be
  // rescued to <body> BEFORE the router replaces app.innerHTML — otherwise it
  // is destroyed along with the canvas and never comes back.
  const skyEl = document.getElementById('sky');
  if(skyEl && skyEl.parentElement !== document.body){
    document.body.insertBefore(skyEl, document.body.firstChild);
  }

  app.innerHTML = html;
  bindSeq(app);

  // on the projects view it becomes the middle layer of the three-layer field
  const netEl = document.getElementById('net');
  if(skyEl && netEl && nav === 'index') netEl.appendChild(skyEl);
  if(skyEl) window.dispatchEvent(new Event('resize'));   // re-fit to the new box

  initNetwork();
  document.querySelectorAll('nav.primary a').forEach(a=>a.classList.toggle('on', a.dataset.nav===nav));
  document.getElementById('nav').classList.remove('open');
  document.getElementById('burger').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-drag]')) return;
  const f = e.target.closest('[data-filter]');
  if(f){
    activeFilter = f.dataset.filter;
    if(location.hash !== '#/' && location.hash !== ''){ location.hash = '#/'; } else { route(); }
    return;
  }
  const t = e.target.closest('[data-link-to]');
  if(t){ location.hash = t.dataset.linkTo; }
});
// clicking the wordmark returns to Projects and puts the layout back
document.getElementById('mark').addEventListener('click', e=>{
  if(location.hash === '#/' || location.hash === ''){
    e.preventDefault();
    if(resetLayout) resetLayout();
  }
});
document.getElementById('burger').addEventListener('click',e=>{
  const nav = document.getElementById('nav');
  e.currentTarget.setAttribute('aria-expanded', nav.classList.toggle('open'));
});
const totopEl = document.getElementById('totop');
if(totopEl) totopEl.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('hashchange',route);

route();
</script>
